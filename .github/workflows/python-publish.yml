# 在 GitHub Release 发布后，构建并上传到 PyPI（Trusted Publishing / OIDC，无需 API Token）。
# 文档: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries
#
# 首次使用前请完成:
# 1. GitHub 仓库 Settings → Environments → 新建环境 `pypi`（建议加 Required reviewers）
# 2. PyPI → Account settings → Publishing → Add a new pending publisher:
#      - PyPI Project Name: agentic-function
#      - Owner: loadingvx
#      - Repository: agentic-function
#      - Workflow name: python-publish.yml
#      - Environment name: pypi
# 3. 发版前把 pyproject.toml 与 agentic_function/__init__.py 的 version 改成与 tag 一致
#    （tag 可为 v0.1.0 或 0.1.0；包版本必须是去掉 v 后的字符串）

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify version matches release tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"

          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )"

          INIT_VERSION="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("agentic_function/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not m:
              raise SystemExit("未在 agentic_function/__init__.py 中找到 __version__")
          print(m.group(1))
          PY
          )"

          echo "Release tag: ${TAG}"
          echo "期望版本:    ${EXPECTED}"
          echo "pyproject:   ${PROJECT_VERSION}"
          echo "__init__:    ${INIT_VERSION}"

          if [ "${PROJECT_VERSION}" != "${EXPECTED}" ] || [ "${INIT_VERSION}" != "${EXPECTED}" ]; then
            echo "::error::版本不一致。请先把 pyproject.toml 与 agentic_function/__init__.py 的版本改为 ${EXPECTED}，再创建同名 Release（tag 可用 v${EXPECTED}）。"
            exit 1
          fi

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lah dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # Trusted Publishing (OIDC) 必需
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/agentic-function

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 发布失败时打印更清晰的校验信息（不会泄露密钥）
          verbose: true
          print-hash: true
